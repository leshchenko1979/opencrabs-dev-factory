[pytest]
# ---------------------------------------------------------------------------
# tools/tests/pytest — the migration target for tools/tests/run.sh.
#
# The shell harness stays the gate until parity is proven (plan §5/§6), so this
# ini is additive: nothing here changes how run.sh behaves.
#
# RUN
#   python3 -m pytest tools/tests/pytest/              # serial, the default
#   python3 -m pytest tools/tests/pytest/ -n auto      # one worker per CPU
#   python3 -m pytest tools/tests/pytest/ -n 0         # explicit serial
#   python3 -m pytest tools/tests/pytest/ -k ledger    # by name
#   python3 -m pytest tools/tests/pytest/ -m "not slow"
#
# -n 0 IS A SUPPORTED MODE, not an accident: every fixture is worker-agnostic
# (tmp_path_factory is per-worker under xdist and per-session without it), so
# the serial fallback needs ZERO test changes. That is the acceptance bar for
# the whole migration — if a test needs `-n 0` to pass, the fixture is wrong.
#
# RECEIPT
#   tools/tests/pytest-receipt.json — written CONTROLLER-ONLY, same 18 fields
#   as run.sh:emit_summary plus the `timing` object. Override the path with
#   OC_PYTEST_RECEIPT. A collect-only run writes nothing (it is not a verdict).
# ---------------------------------------------------------------------------

# --durations=25 answers "where did the wall go" without a separate experiment;
# -ra prints the short test summary for skips/xfails/failures, which is how a
# serial-marked leg that was skipped shows up as VISIBLE rather than absent.
addopts = --durations=25 -ra

testpaths = .

# Markers. Registered here so `-m` selection works and so an unknown marker is
# a hard error (pytest's strict-markers) rather than a silent no-op that makes
# `-m serial` look like it selected nothing.
markers =
    serial: mutually-exclusive legs (flock, live ports, the canonical receipt). Never runs concurrently with another serial test; under xdist these are pinned to one worker via xdist_group.
    network: reaches the network (github, the A2A endpoint, package registries). Excluded from the gate.
    live_state: reads or writes a REAL store (the fleet ledger, workers.json, the production checkout). NEVER runs in the gate.
    slow: takes more than a few seconds; deselected by -m "not slow".

# strict_markers: an unregistered marker is an error. Without it `-m serial`
# silently matches nothing and the run reads green while the serial legs never
# ran — the same shape as the #120 chk() defect, one layer up.
strict_markers = true

# xdist_group USAGE (registered by pytest-xdist, so it is not in the list above)
# ---------------------------------------------------------------------------
# Mark every leg that must not overlap another with a shared group name:
#
#     @pytest.mark.serial
#     @pytest.mark.xdist_group("battery-lock")
#     def test_canonical_receipt(...): ...
#
# xdist then schedules all tests in one group onto the SAME worker, in order, so
# the group's legs never overlap — which is what `serial` means once there is
# more than one worker. A `serial` test with NO group would be scattered across
# workers and overlap freely, so the two markers go together:
#
#   * `serial` alone  = "this leg must not overlap" (a claim)
#   * `xdist_group`   = the mechanism that makes the claim true under -n N
#
# Under `-n 0` the group is inert and the marker is documentation, which is why
# the serial fallback needs no changes.
#
# TIMEOUTS
# ---------
# pytest-timeout is present. A whole-suite default is deliberately NOT set here:
# run_tool/run_selftest carry a REQUIRED per-call bound, and a blanket
# `timeout =` would mask a leg that forgot one. Put `@pytest.mark.timeout(300)`
# on an individual leg that needs a ceiling.

# xdist: fail fast is the battery's preference — a red is a red, and continuing
# to run 68 sections after the first failure wastes the box other lanes share.
# (`-x` is passed on the command line, not here, so `--lf` re-runs stay useful.)
