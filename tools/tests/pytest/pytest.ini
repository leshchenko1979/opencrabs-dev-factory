[pytest]
# ---------------------------------------------------------------------------
# tools/tests/pytest — THE GATE. The shell harness is retired.
#
# This file is the gate's definition, not a suggestion: `addopts` below carries
# the concurrency and selection the box can actually take, so the bare command
# IS the gate. Anything passed on the command line wins over addopts, which is
# how a developer narrows a run — and why narrowing one is visible rather than
# silent.
#
# RUN — the gate (no arguments needed; addopts supplies -n 2 and -m "not slow")
#   python3 -m pytest tools/tests/pytest/
#
# RUN — narrowed, for debugging
#   python3 -m pytest tools/tests/pytest/ -n 0         # serial, one worker
#   python3 -m pytest tools/tests/pytest/ -k ledger    # by name
#   python3 -m pytest tools/tests/pytest/ -m slow      # the slow legs
#
# WHY -n 2 IS IN addopts AND NOT LEFT TO THE CALLER
#   At -n 4 on this 3.9 GB box, seventeen unrelated tests reddened with identical
#   jemalloc EAGAIN (errno 11) thread-creation noise: overlapping --selftest
#   process trees against the scope's TasksMax. Zero real defects — the box, not
#   the code. A gate that goes red for reasons unrelated to the change is a gate
#   people learn to ignore, so the safe concurrency is baked in and `caps_for(n)`
#   scales TasksMax/MemoryMax per worker.
#
# WHY -m "not slow" IS IN addopts
#   `slow` means "on request": those legs drive full tool selftests and take
#   minutes each. In the gate they would make every run a half-hour. They are
#   deselected by default and named explicitly when wanted.
#
# -n 0 IS A SUPPORTED MODE, not an accident: every fixture is worker-agnostic
# (tmp_path_factory is per-worker under xdist and per-session without it), so
# the serial fallback needs ZERO test changes. If a test needs `-n 0` to pass,
# the fixture is wrong.
#
# RECEIPT
#   tools/tests/battery-last.json — written CONTROLLER-ONLY, 18 fields. This is
#   the path `oc-ledger sync` reads as the version-bump gate, so it is a contract
#   with consumers that know nothing about pytest. Override with
#   OC_PYTEST_RECEIPT for a scoped run — otherwise a filtered run stamps a PASS
#   backed by the few tests it selected (factory #214). A collect-only run
#   writes nothing: it is not a verdict.
# ---------------------------------------------------------------------------

# --durations=25 answers "where did the wall go" without a separate experiment;
# -ra prints the short test summary for skips/xfails/failures, which is how a
# serial-marked leg that was skipped shows up as VISIBLE rather than absent.
# -n 2 and -m "not slow" are the GATE, not conveniences — see the header. A
# command-line -n/-m overrides them, which is the only supported way to narrow a
# run, and `test_gate_defaults` pins these values so a "cleanup" cannot quietly
# make the gate run at unsafe concurrency or re-admit the slow legs.
addopts = --durations=25 -ra --dist loadgroup -n 2 -m "not slow"

testpaths = .

# Markers. Registered here so `-m` selection works and so an unknown marker is
# a hard error (pytest's strict-markers) rather than a silent no-op that makes
# `-m serial` look like it selected nothing.
markers =
    serial: mutually-exclusive legs (flock, live ports, the canonical receipt). Never runs concurrently with another serial test; under xdist these are pinned to one worker via xdist_group.
    slow: takes more than a few seconds; deselected by -m "not slow".

# TWO MARKERS WERE DELETED HERE ON PURPOSE (factory #203) — do not re-add them
# "for symmetry". ``network`` and ``live_state`` were registered and selected
# NOTHING: zero uses across the suite, and no leg genuinely qualifies. Every gh
# call goes through the ``gh_stub`` fixture, ``_assert_no_live_state`` REFUSES a
# production path at launch, ``allow_live_state=True`` appears in zero tests, and
# no leg runs curl/urllib/requests/socket. A registered marker that selects
# nothing is the ``-m serial`` lie this file's comment above warns about, one
# layer up: a reader sees the name and believes the suite excludes something it
# never had. If a real live-state leg ever arrives, register the marker THEN,
# in the same commit as the leg that carries it.

# strict_markers: an unregistered marker is an error. Without it `-m serial`
# silently matches nothing and the run reads green while the serial legs never
# ran — the same shape as the #120 chk() defect, one layer up.
strict_markers = true

# xdist_group USAGE (registered by pytest-xdist, so it is not in the list above)
# ---------------------------------------------------------------------------
# Mark every leg that must not overlap another with a shared group name:
#
#     @pytest.mark.serial
#     @pytest.mark.xdist_group("battery-lock")
#     def test_canonical_receipt(...): ...
#
# xdist then schedules all tests in one group onto the SAME worker, in order, so
# the group's legs never overlap — which is what `serial` means once there is
# more than one worker. A `serial` test with NO group would be scattered across
# workers and overlap freely, so the two markers go together:
#
#   * `serial` alone  = "this leg must not overlap" (a claim)
#   * `xdist_group`   = the mechanism that makes the claim true under -n N
#
# AND THE MECHANISM ONLY EXISTS UNDER `--dist loadgroup`, which is why addopts
# pins it. xdist's DEFAULT scheduler is `load`, which ignores xdist_group
# ENTIRELY: every group marker in this suite was inert under -n N until the
# serial witness caught two same-group legs holding at once and failing on it
# (test_harness_serialisation.py). A marker that schedules nothing is worse than
# no marker — it reads as a guarantee.
#
# Under `-n 0` the group is inert and the marker is documentation, which is why
# the serial fallback needs no changes.
#
# TIMEOUTS
# ---------
# pytest-timeout is present. A whole-suite default is deliberately NOT set here:
# run_tool/run_selftest carry a REQUIRED per-call bound, and a blanket
# `timeout =` would mask a leg that forgot one. Put `@pytest.mark.timeout(300)`
# on an individual leg that needs a ceiling.

# xdist: fail fast is the battery's preference — a red is a red, and continuing
# to run 68 sections after the first failure wastes the box other lanes share.
# (`-x` is passed on the command line, not here, so `--lf` re-runs stay useful.)
